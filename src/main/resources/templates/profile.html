<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile settings | Nagrik Setu</title><link rel="stylesheet" href="/css/style.css"></head><body class="report-page"><nav><a class="brand" href="/"><span>NS</span>Nagrik Setu</a><a class="text-link" href="/">← Back to dashboard</a></nav><main class="form-wrap"><section class="form-copy"><p class="eyebrow">Account</p><h1>Profile<br><i>settings.</i></h1><p>Keep your account details current. Your role and, for staff members, department are managed when the account is created.</p></section><section class="report-card"><form action="/profile" method="post"><div class="form-header"><span th:text="${user.role}">CITIZEN</span><h2 th:text="${user.fullName}">Your name</h2></div><p class="success-message" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p><label>Full name<input name="fullName" required th:value="${user.fullName}"></label><label>Email address<input disabled th:value="${user.email}"></label><label th:if="${user.department != null}">Department<input disabled th:value="${user.department}"></label><label>New password <small>Leave blank to keep your current password.</small><input name="newPassword" type="password" minlength="6" placeholder="At least 6 characters"></label><button class="button submit">Save settings <b>→</b></button></form><form class="profile-logout" action="/auth/logout" method="post"><button class="link-button">Sign out of Nagrik Setu</button></form></section></main></body></html>
